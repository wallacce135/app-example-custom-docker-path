# Ловушка для проверки выбора compose-файла. Рабочий файл — compose.yml рядом.
# Если на странице приложения указан этот файл, платформа взяла не тот compose.
services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_COMPOSE_PATH: services/flask-counter/docker-compose.yml
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
